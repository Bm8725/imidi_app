<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>iMIDI – offline</title>
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:#0D0E12;color:#fff;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:24px}
  h1{font-size:1.4rem;margin:0 0 8px}
  p{margin:0 0 20px;opacity:.75;max-width:32ch}
  button{background:#67E8F9;color:#0D0E12;border:0;border-radius:10px;padding:10px 18px;font-weight:600;font-size:1rem;cursor:pointer}
</style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Reconnect to sync with the cloud. Anything you already opened stays available.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
